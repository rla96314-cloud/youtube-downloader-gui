name: Discord 알림 테스트

# 웹훅·스레드 설정이 맞는지 빌드 없이 확인용. Actions 탭 → Run workflow.
on:
  workflow_dispatch:
    inputs:
      message:
        description: '보낼 내용'
        default: '🔔 디스코드 알림 테스트 (youtube-downloader-gui CI)'
        required: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 스레드에 테스트 메시지
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ secrets.DISCORD_THREAD_ID }}
          MSG: ${{ inputs.message }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "DISCORD_WEBHOOK_URL 시크릿이 없습니다 (저장소 Settings → Secrets)"; exit 1; fi
          url="$DISCORD_WEBHOOK_URL"
          [ -n "$DISCORD_THREAD_ID" ] && url="$url?thread_id=$DISCORD_THREAD_ID"
          jq -n --arg c "$MSG" '{content:$c, allowed_mentions:{parse:[]}}' \
            | curl -sS -f -H 'Content-Type: application/json' -d @- "$url" >/dev/null && echo "전송 완료"
